name: SonarCloud

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rws

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check SonarCloud project access
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -sS \
            -u "$SONAR_TOKEN:" \
            -w "\nHTTP status: %{http_code}\n" \
            "https://sonarcloud.io/api/projects/search?organization=theonionproject&projects=rws-metroweb"
        run: echo "$SONAR_TOKEN"

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean verify sonar:sonar -Dsonar.token=$SONAR_TOKEN

